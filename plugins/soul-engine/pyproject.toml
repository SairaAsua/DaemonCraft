[project]
name = "daemoncraft-soul-engine"
version = "2.0.0"
description = "DaemonCraft Soul Engine — Human Design oracle for autonomous agents via MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pyswisseph>=2.10",
    "timezonefinder>=6.0",
]

[project.scripts]
daemoncraft-soul = "server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
